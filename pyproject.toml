[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "task-manager"
version = "0.8.0"
description = "Десктопный менеджер задач на PySide6"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.10.1",
    "platformdirs==4.3.8",
]

[project.scripts]
task-manager = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["resources/icons/*.png"]

# ── PyInstaller (запускать через: pyinstaller task-manager.spec) ──────────────
# Отдельный spec-файл: task-manager.spec
